<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FQ Panel</title>
    <link rel="stylesheet" type="text/css" href="fq1.css">
</head>
<body>
    <div class="panel-container">
        <!-- Header with Wagenklasse -->
        <div class="panel-header">
            <div></div>
            <button class="nav-btn" id="wagen-prev">◀</button>
            <div id="wagenklasse" class="header-field klasse-2">2</div>
            <button class="nav-btn" id="wagen-next">▶</button>
        </div>

        <!-- Section Bar -->
        <div class="section-bar">
            <table>
                <tr>
                    <td>EBG</td>
                    <td>TestTesttest</td>
                    <td>12345</td>
                </tr>
                <tr>
                    <td>LB</td>
                    <td>LB</td>
                    <td>65322</td>
                </tr>
            </table>
        </div>

        <!-- Data Display -->
        <div class="data-display">
            <div class="data-field">48099</div>
            <div class="data-field small" style="font-size: 10px;">□</div>
            <div class="data-field">65322</div>
        </div>
        <div class="data-display">
            <div class="data-field">in</div>
            <div class="data-field small">RK</div>
            <div class="data-field">65399 out</div>
        </div>

        <!-- Button Row -->
        <div class="button-row">
            <button class="button-small">1./2.</button>
            <button class="button-small">Ausl</button>
            <button class="button-small">Steh</button>
            <button class="button-small">Ansch</button>
        </div>

        <!-- Grid Section -->
        <div class="grid-section">
            <button class="grid-cell">ABO</button>
            <button class="grid-cell">BIGT</button>
            <button class="grid-cell">EF</button>
            <button class="grid-cell">HR</button>
            <button class="grid-cell">TK</button>
            <button class="grid-cell">VERBUND</button>
            <button class="grid-cell">1/2-ABO</button>
            <button class="grid-cell">SPEZ</button>
            <button class="grid-cell">MFK</button>
            <button class="grid-cell">GRUPPE</button>
            <button class="grid-cell">JUN/SEN</button>
            <button class="grid-cell">EURAIL</button>
            <button class="grid-cell">I-ABO</button>
            <button class="grid-cell">GA</button>
            <button class="grid-cell">1/2</button>
            <button class="grid-cell">FAMILIE</button>
        </div>

        <!-- Control Bar -->
        <div class="control-bar">
            <button class="control-field" id="abteilung">Abt.2.</button>
            <button class="control-field">2/100</button>
            <button class="control-field">1x</button>
            <button class="star-icon">★</button>
            <button class="control-field highlight">ASP</button>
            <button class="control-field">1</button>
            <button class="control-field">Leer</button>
        </div>

        <!-- Keyboard -->
        <div class="keyboard">
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key" style="grid-row: 1; grid-column: 4; grid-row-end: 3;">⊡</button>
            
            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            
            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key" style="grid-row: 4; grid-column: 4;">Weiter</button>
            
            <button class="key">abc</button>
            <button class="key">0</button>
            <button class="key function">Hafas-Zuglauf</button>
            
            <button class="key function" style="grid-column: 1 / 5; margin-top: 8px;">Enter</button>
        </div>
    </div>

    <!-- Wagenklasse Modal -->
    <div class="modal-overlay" id="wagenklasse-modal">
        <div class="modal">
            <div class="modal-title">Wagenklasse</div>
            <div class="modal-option" data-value="2">2. Klasse (2)</div>
            <div class="modal-option" data-value="1">1. Klasse (1)</div>
            <div class="modal-option" data-value="12">1. und 2. Klasse (12)</div>
            <div class="modal-option" data-value="WR">Restaurant (WR)</div>
            <div class="modal-option" data-value="FW">Familienwagen (FW)</div>
            <div class="modal-option" data-value="WL">Schlafwagen (WL)</div>
            <div class="modal-option" data-value="Lok">Lokomotive (Lok)</div>
            <div class="modal-option" data-value="D">Dienstwagen (D)</div>
            <div class="modal-option" data-value="CC">CC (CC)</div>
            <div class="modal-option delete-option" id="wagen-delete">Wagen löschen</div>
            <div class="modal-close">
                <button onclick="closeModal('wagenklasse-modal')">Abbrechen</button>
            </div>
        </div>
    </div>

    <!-- Abteilung Modal -->
    <div class="modal-overlay" id="abteilung-modal">
        <div class="modal">
            <div class="modal-title">Abteilung</div>
            <div class="modal-option" data-value="↓">⬇ unten</div>
            <div class="modal-option" data-value="↑">⬆ oben</div>
            <div class="modal-option" data-value="—">— Einstöckig</div>
            <div class="modal-close">
                <button onclick="closeModal('abteilung-modal')">Abbrechen</button>
            </div>
        </div>
    </div>

    <script>
        let currentWagen = 1;
        let wagen = {
            1: { klasse: '2', abteilung: '↓' },
            2: { klasse: '2', abteilung: '—' },
            3: { klasse: '1', abteilung: '↑' }
        };

        const wagenklasseElement = document.getElementById('wagenklasse');
        const abteilungElement = document.getElementById('abteilung');
        const wagenklasseModal = document.getElementById('wagenklasse-modal');
        const abteilungModal = document.getElementById('abteilung-modal');

        function updateDisplay() {
            const w = wagen[currentWagen];
            wagenklasseElement.textContent = w.klasse;
            wagenklasseElement.className = 'header-field ' + getKlasseClass(w.klasse);
            
            let abtText = 'Abt.2.';
            if (w.abteilung === '↑') abtText = 'Abt.1.';
            else if (w.abteilung === '—') abtText = 'Einstöckig';
            abteilungElement.textContent = abtText;
        }

        function getKlasseClass(klasse) {
            const classNames = {
                '2': 'klasse-2',
                '1': 'klasse-1',
                '12': 'klasse-12',
                'WR': 'klasse-wr',
                'FW': 'klasse-fw',
                'WL': 'klasse-wl',
                'Lok': 'klasse-lok',
                'D': 'klasse-d',
                'CC': 'klasse-cc'
            };
            return classNames[klasse] || 'klasse-unbekannt';
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        document.getElementById('wagen-prev').addEventListener('click', () => {
            if (currentWagen > 1) {
                currentWagen--;
                updateDisplay();
            }
        });

        document.getElementById('wagen-next').addEventListener('click', () => {
            const nextWagen = currentWagen + 1;
            if (!wagen[nextWagen]) {
                wagen[nextWagen] = { klasse: '?', abteilung: '—' };
            }
            currentWagen = nextWagen;
            updateDisplay();
        });

        wagenklasseElement.addEventListener('click', () => {
            openModal('wagenklasse-modal');
        });

        abteilungElement.addEventListener('click', () => {
            openModal('abteilung-modal');
        });

        // Wagenklasse Modal Options
        document.querySelectorAll('#wagenklasse-modal .modal-option').forEach(opt => {
            if (opt.id === 'wagen-delete') return;
            opt.addEventListener('click', () => {
                wagen[currentWagen].klasse = opt.dataset.value;
                updateDisplay();
                closeModal('wagenklasse-modal');
            });
        });

        document.getElementById('wagen-delete').addEventListener('click', () => {
            const wagenNummern = Object.keys(wagen).map(Number).sort((a, b) => a - b);
            if (wagenNummern.length === 1) return;

            delete wagen[currentWagen];
            const nextWagen = wagenNummern.find(wagenNummer => wagenNummer > currentWagen);
            currentWagen = nextWagen || wagenNummern[wagenNummern.length - 2];
            updateDisplay();
            closeModal('wagenklasse-modal');
        });

        // Abteilung Modal Options
        document.querySelectorAll('#abteilung-modal .modal-option').forEach(opt => {
            opt.addEventListener('click', () => {
                wagen[currentWagen].abteilung = opt.dataset.value;
                updateDisplay();
                closeModal('abteilung-modal');
            });
        });

        // Close on overlay click
        document.querySelectorAll('.modal-overlay').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal(modal.id);
                }
            });
        });

        updateDisplay();
    </script>
</body>
</html>
