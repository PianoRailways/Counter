<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FQ Panel</title>
    <link rel="stylesheet" type="text/css" href="fq1.css">
</head>
<body>
    <div class="panel-container">
        <!-- Header -->
        <div class="panel-header">
            <div class="header-field highlight">1</div>
            <div class="header-field highlight">2</div>
            <div class="header-field highlight">3</div>
        </div>

        <!-- Section Bar -->
        <div class="section-bar">
            <table style="width: 100%; flex: 1; align-items: center; text-align: left;">
                <tr>
                    <td>EBG</td>
                    <td>TestTesttest</td>
                    <td>12345</td>
                </tr>
                <tr>
                    <td>LB</td>
                    <td>LB</td>
                    <td>65322</td>
                </tr>
            </table>
        </div>
<hr>
        <!-- Data Display -->
        <div class="data-display">
            <div class="data-field">48099</div>
            <div class="data-field small" style="font-size: 10px;">□</div>
            <div class="data-field">65322</div>
        </div>
        <div class="data-display">
            <div class="data-field">in</div>
            <div class="data-field small">RK</div>
            <div class="data-field">65399 out</div>
        </div>

        <!-- Button Row -->
        <div class="button-row">
            <div class="button-small"></div>
            <div class="button-small">1./2.</div>
            <div class="button-small">Ausl</div>
            <div class="button-small">Ansch</div>
        </div>
        <div class="button-row" style="border-bottom: none;">
            <div class="button-small"></div>
            <div class="button-small"></div>
            <div class="button-small"></div>
            <div class="button-small">Steh</div>
        </div>

        <!-- Grid Section -->
        <div class="grid-section">
            <div class="grid-cell">ABO</div>
            <div class="grid-cell">BIGT</div>
            <div class="grid-cell">EF</div>
            <div class="grid-cell">HR</div>
            <div class="grid-cell">TK</div>
            <div class="grid-cell">VERBUND</div>
            <div class="grid-cell">1/2-ABO</div>
            <div class="grid-cell">SPEZ</div>
            <div class="grid-cell">MFK</div>
            <div class="grid-cell">GRUPPE</div>
            <div class="grid-cell">JUN/SEN</div>
            <div class="grid-cell">EURAIL</div>
            <div class="grid-cell">I-ABO</div>
            <div class="grid-cell">GA</div>
            <div class="grid-cell">1/2</div>
            <div class="grid-cell">FAMILIE</div>
        </div>

        <!-- Control Bar -->
        <div class="control-bar">
            <div class="control-field">Abt.2.</div>
            <div class="control-field">2/100</div>
            <div class="control-field">1x</div>
            <div class="star-icon">★</div>
            <div class="control-field highlight">ASP</div>
            <div class="control-field">1</div>
            <div class="control-field">Leer</div>
        </div>

        <!-- Keyboard -->
        <div class="keyboard">
            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="key" style="grid-row: 1; grid-column: 4; grid-row-end: 3;">⊡</div>
            
            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
            
            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="key" style="grid-row: 4; grid-column: 4;">Weiter</div>
            
            <div class="key">abc</div>
            <div class="key">0</div>
            <div class="key function">Hafas-Zuglauf</div>
            
            <div class="key function" style="grid-column: 1 / 5; margin-top: 8px;">Enter</div>
        </div>
    </div>
</body>
</html>
